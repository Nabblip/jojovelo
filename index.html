<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jojovelo1950</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@400;500;600&display=swap');

    :root {
      --cream: #F1E7D4;
      --ink: #2B2420;
      --brass: #9C7A3C;
      --brass-dark: #7A5E2A;
      --line: #C9B892;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--cream);
      font-family: 'Montserrat', sans-serif;
      color: var(--ink);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background-image:
        radial-gradient(circle at 20% 15%, rgba(156, 122, 60, 0.08), transparent 40%),
        radial-gradient(circle at 80% 85%, rgba(156, 122, 60, 0.08), transparent 40%);
    }

    .links {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a.btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-radius: 3px;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.02em;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: 1px solid transparent;
    }

    a.btn:active {
      transform: scale(0.98);
    }

    .btn-call {
      background: var(--ink);
      color: var(--cream);
    }

    .btn-call:hover {
      box-shadow: 0 3px 10px rgba(43, 36, 32, 0.25);
    }

    .btn-insta {
      background: transparent;
      color: var(--ink);
      border-color: var(--brass);
    }

    .btn-insta:hover {
      background: rgba(156, 122, 60, 0.08);
    }

    .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .label-group {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .label-main {
      font-size: 15px;
    }

    .label-sub {
      font-size: 11px;
      opacity: 0.65;
      letter-spacing: 0.03em;
    }

  </style>
</head>

<body>

  <div class="links">
    <a class="btn btn-call" href="tel:+41797862203">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path
          d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
      </svg>
      <span class="label-group">
        <span class="label-main">Appeler</span>
        <span class="label-sub">079 786 22 03</span>
      </span>
    </a>

    <a class="btn btn-insta" href="https://www.instagram.com/jojovelo1950/" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
      </svg>
      <span class="label-group">
        <span class="label-main">Instagram</span>
        <span class="label-sub">@jojovelo1950</span>
      </span>
    </a>
  </div>

</body>

</html>
